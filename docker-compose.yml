# mynet coordinator (control plane) + pair UDP relay (NAT fallback).
# Overlay WireGuard is still peer-to-peer when NAT allows it.
# The relay only forwards opaque UDP between exactly two peers.
#
# On the VPS, copy `.env.example` to `.env`. Publish TCP 9993 and UDP 9994.
# Laptops: put VPS_PUBLIC_IP:9993 in ~/.config/mynet/discovery.toml, then
# `sudo rnet start` / `sudo rnet connect SECRET`.

services:
  coordinator:
    build:
      context: .
      dockerfile: deploy/coordinator/Dockerfile
    image: mynet-coordinator:local
    container_name: mynet-coordinator
    restart: unless-stopped
    ports:
      - "${MYNET_COORD_PORT:-9993}:9993"
    environment:
      MYNET_LISTEN: "0.0.0.0:9993"
      MYNET_JOIN_TOKEN: "${MYNET_JOIN_TOKEN:-}"
      MYNET_NETWORK: "${MYNET_NETWORK:-mynet}"
      MYNET_STATE_PATH: "/var/lib/mynet/state.toml"
    volumes:
      - coordinator-state:/var/lib/mynet

  relay:
    build:
      context: .
      dockerfile: deploy/relay/Dockerfile
    image: mynet-relay:local
    container_name: mynet-relay
    restart: unless-stopped
    ports:
      - "${MYNET_RELAY_PORT:-9994}:9994/udp"
    environment:
      MYNET_LISTEN: "0.0.0.0:9994"

volumes:
  coordinator-state:
